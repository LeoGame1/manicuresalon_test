<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Кабинет мастера</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<main>
  <div class="top"><h1 id="title">💅 Кабинет мастера</h1><button class="ghost hidden" id="out">Выйти</button></div>

  <section id="login">
    <h2>Вход</h2>
    <form id="lf" class="add" style="grid-template-columns:1fr">
      <input id="name" placeholder="Ваше имя (как в списке мастеров)" autocomplete="username" aria-label="Имя">
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль">
      <button type="submit">Войти</button>
    </form>
    <p class="hint">Пароль выдаёт владелец салона.</p>
    <p class="err" id="lerr"></p>
  </section>

  <div id="app" style="display:none;gap:20px">
    <section>
      <div class="tabs" id="tabs">
        <button class="on" data-t="bk">📅 Мои записи</button>
        <button class="ghost" data-t="hrs">⏱ Мои часы</button>
        <button class="ghost" data-t="team">👥 Коллектив</button>
        <button class="ghost" data-t="chat">💬 Чат салона</button>
      </div>
    </section>
    <section id="p-bk"></section>
    <section id="p-hrs" class="hidden"></section>
    <section id="p-team" class="hidden"></section>
    <section id="p-chat" class="hidden"></section>
  </div>
</main>

<script src="/static/common.js"></script>
<script>
const api = Api(["mst"], () => { $("app").style.display = "none"; $("out").classList.add("hidden"); $("login").style.display = "block"; });

async function load() {
  const d = await api("/api/master/data");
  $("login").style.display = "none"; $("app").style.display = "grid"; $("out").classList.remove("hidden");
  $("title").textContent = "💅 " + d.name;

  let html = "<h2>📅 Мои записи</h2>", last = "";
  for (const x of d.bookings) {
    if (x.date !== last) { html += `<div class="day">${fmtDate(x.date)}</div>`; last = x.date; }
    html += `<div class="item"><div>🕒 ${esc(x.time)} · 👤 ${esc(x.name)}<small>📞 ${esc(x.phone)}${x.tg_username ? " · ✈️ @" + esc(x.tg_username) : ""}${x.comment ? " · 💬 " + esc(x.comment) : ""}</small></div></div>`;
  }
  $("p-bk").innerHTML = html + (d.bookings.length ? "" : '<p class="empty">Ближайших записей нет. Отдыхайте! ✨</p>');

  $("p-hrs").innerHTML = "<h2>⏱ Мои часы</h2>" + [["week", "Эта неделя"], ["prev", "Прошлая неделя"], ["month", "Этот месяц"]]
    .map(([k, t]) => `<div class="item"><div>🗓 ${t}</div><div><b>${d.hours[k]} ч</b></div></div>`).join("") +
    '<p class="hint">Считаются приёмы по 2 часа, прошедшие и сегодняшние.</p>';

  $("p-team").innerHTML = "<h2>👥 Коллектив салона</h2>" + d.team.map(n => `<div class="item"><div>💅 ${esc(n)}</div></div>`).join("");

  $("p-chat").innerHTML = "<h2>💬 Общий чат салона</h2>" + (d.chat_link
    ? `<p>Здесь собирается вся команда 👇</p><a class="btn" href="${esc(d.chat_link)}" target="_blank" rel="noopener">🚪 Перейти в чат</a>`
    : '<p class="empty">🔒 Ссылка на чат временно недоступна. Владелец скоро обновит её.</p>');
}

$("tabs").addEventListener("click", e => {
  const t = e.target.dataset.t; if (!t) return;
  [...$("tabs").children].forEach(b => { b.classList.toggle("on", b === e.target); b.classList.toggle("ghost", b !== e.target); });
  ["bk", "hrs", "team", "chat"].forEach(k => $("p-" + k).classList.toggle("hidden", k !== t));
});

$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("lerr").textContent = "";
  try { localStorage.setItem("mst", (await api("/api/staff/login", "POST", {role: "master", name: $("name").value, password: $("pw").value})).token); $("pw").value = ""; await load(); }
  catch (err) { $("lerr").textContent = err.message; }
});
$("out").addEventListener("click", () => { localStorage.removeItem("mst"); location.reload(); });
if (localStorage.getItem("mst")) load().catch(() => {});
</script>
</body>
</html>
