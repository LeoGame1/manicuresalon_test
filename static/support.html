<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Вопросы клиентов</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<main>
  <div class="top">
    <h1>💬 Вопросы клиентов</h1>
    <div class="nav hidden" id="nav"><a class="btn ghost hidden" id="adm" href="/admin">👑 Админ-панель</a><button class="ghost" id="out">Выйти</button></div>
  </div>

  <section id="login">
    <h2>Вход для поддержки</h2>
    <form id="lf" class="add" style="grid-template-columns:1fr">
      <input id="name" placeholder="Ваше имя" autocomplete="username" aria-label="Имя">
      <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль">
      <button type="submit">Войти</button>
    </form>
    <p class="hint">Пароль выдаёт владелец салона. Владелец может войти в <a href="/admin">админ-панель</a>, после этого эта страница откроется сама.</p>
    <p class="err" id="lerr"></p>
  </section>

  <div id="app" style="display:none;gap:20px">
    <section id="listbox">
      <div class="tabs" id="tabs">
        <button class="on" data-s="open">🔴 Открытые</button>
        <button class="ghost" data-s="closed">✅ Закрытые</button>
        <button class="ghost" id="refresh">🔄 Обновить</button>
      </div>
      <div id="list"></div>
    </section>

    <section id="chat" class="hidden">
      <div class="top"><h2 id="ctitle" style="margin:0"></h2><button class="ghost" id="back">← К списку</button></div>
      <p class="hint" id="cmeta"></p>
      <div id="msgs"></div>
      <form id="rf" style="display:grid;gap:10px;margin-top:14px">
        <textarea id="rtext" maxlength="1000" placeholder="Ваш ответ клиенту…" aria-label="Ответ"></textarea>
        <div class="acts" style="justify-content:flex-start"><button type="submit">📨 Отправить</button><button type="button" class="ghost" id="close">✅ Закрыть вопрос</button><button type="button" class="ghost" id="back2">📋 К списку вопросов</button></div>
      </form>
      <p class="err" id="rerr"></p>
    </section>
  </div>
</main>

<script src="/static/common.js"></script>
<script>
const api = Api(["adm", "sup"], () => { $("app").style.display = "none"; $("nav").classList.add("hidden"); $("login").style.display = "block"; });
let status = "open", current = null, timer = null;

async function showList() {
  current = null; clearInterval(timer);
  $("chat").classList.add("hidden"); $("listbox").classList.remove("hidden");
  const d = await api("/api/support/tickets?status=" + status);
  $("login").style.display = "none"; $("app").style.display = "grid"; $("nav").classList.remove("hidden");
  $("adm").classList.toggle("hidden", !localStorage.getItem("adm"));
  $("list").innerHTML = d.tickets.map(t => `<div class="item" data-t="${t.id}" style="cursor:pointer"><div>${t.last_sender === "client" && t.status === "open" ? "🔴" : "🟡"} <b>#${t.id}</b> · ${esc(t.client_name || "Клиент")} · ${t.channel === "site" ? "🌐" : "✈️"}<small>${esc((t.last_text || "").slice(0, 90))} · ${fmtStamp(t.updated_at)}</small></div><button class="ghost" data-t="${t.id}">Открыть</button></div>`).join("")
    || `<p class="empty">${status === "open" ? "Открытых вопросов нет ✨" : "Закрытых вопросов нет."}</p>`;
}

async function openTicket(id, keepScroll) {
  current = id;
  const d = await api("/api/support/tickets/" + id);
  $("listbox").classList.add("hidden"); $("chat").classList.remove("hidden");
  $("ctitle").textContent = `Вопрос #${id} ${d.ticket.channel === "site" ? "🌐" : "✈️"}`;
  $("cmeta").textContent = `${d.ticket.client_name || "Клиент"}${d.ticket.contact ? " · " + d.ticket.contact : ""}${d.ticket.status === "closed" ? " · закрыт" : ""}${d.ticket.channel === "telegram" ? " · ответ придёт клиенту в Telegram" : " · ответ увидит клиент на сайте"}`;
  $("msgs").innerHTML = d.messages.map(m => `<div class="bubble ${m.sender}"><small>${esc(m.author || "")} · ${fmtStamp(m.created_at)}</small>${esc(m.text)}</div>`).join("");
  $("close").classList.toggle("hidden", d.ticket.status === "closed");
  if (!keepScroll) window.scrollTo({top: 0});
  clearInterval(timer); timer = setInterval(() => current && openTicket(current, true).catch(() => {}), 15000);
}

$("list").addEventListener("click", e => { const id = e.target.closest("[data-t]")?.dataset.t; if (id) openTicket(id); });
$("tabs").addEventListener("click", e => {
  if (e.target.id === "refresh") return showList();
  if (!e.target.dataset.s) return;
  status = e.target.dataset.s; [...$("tabs").children].forEach(b => { if (b.dataset.s) { b.classList.toggle("on", b === e.target); b.classList.toggle("ghost", b !== e.target); } });
  showList();
});
$("back").addEventListener("click", showList);
$("back2").addEventListener("click", showList);
$("close").addEventListener("click", async () => { await api(`/api/support/tickets/${current}/close`, "POST"); showList(); });
$("rf").addEventListener("submit", async e => {
  e.preventDefault(); $("rerr").textContent = "";
  try { await api(`/api/support/tickets/${current}/reply`, "POST", {text: $("rtext").value}); $("rtext").value = ""; openTicket(current, true); }
  catch (err) { $("rerr").textContent = err.message; }
});
$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("lerr").textContent = "";
  try { localStorage.setItem("sup", (await api("/api/staff/login", "POST", {role: "support", name: $("name").value, password: $("pw").value})).token); $("pw").value = ""; await showList(); }
  catch (err) { $("lerr").textContent = err.message; }
});
$("out").addEventListener("click", () => { localStorage.removeItem("sup"); localStorage.removeItem("adm"); location.reload(); });
if (localStorage.getItem("adm") || localStorage.getItem("sup")) showList().catch(() => {});
</script>
</body>
</html>
